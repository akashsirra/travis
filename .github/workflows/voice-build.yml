name: Travis native voice build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E 'platforms;android-36|build-tools;36' || true
      - name: Build Travis Voice
        working-directory: android-voice
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Travis Voice APK
        uses: actions/upload-artifact@v4
        with:
          name: travis-voice-debug-apk
          path: android-voice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
